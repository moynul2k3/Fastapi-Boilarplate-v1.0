services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shippros-api
    env_file:
      - .env
    volumes:
      - ./media:/app/media
    restart: always
    command: >
      sh -c "
        aerich upgrade || aerich init-db &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - shippros_net

networks:
  shippros_net:
    driver: bridge
