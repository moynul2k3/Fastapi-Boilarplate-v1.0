<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f7; margin: 0; padding: 0;">

    <table align="center" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); overflow: hidden;">

        <!-- Header -->
        <tr>
            <td style="background-color: #6c5ce7; text-align: center; padding: 30px;">
                <h1 style="color: #ffffff; margin: 0; font-size: 28px;">{{ title }}</h1>
            </td>
        </tr>

        <!-- Body -->
        <tr>
            <td style="padding: 30px; color: #333333; font-size: 16px; line-height: 1.6;">
                <p style="margin: 0 0 20px 0;">Hi {{ name if name else 'there' }},</p>

                <p style="margin: 0 0 20px 0;">{{ message }}</p>

                <p style="margin: 20px 0 10px 0; font-weight: 500;">Your One-Time Password (OTP) is:</p>

                <div style="display: inline-block; margin: 20px 0; padding: 18px 36px; background-color: #6c5ce7; color: #ffffff; font-weight: bold; font-size: 36px; border-radius: 10px; letter-spacing: 4px;">
                    {{ otp }}
                </div>

                <p style="margin: 10px 0 0 0; font-size: 14px; color: #555555;">
                    This OTP will expire in <b>{{ expires_in }} minutes</b>. Do not share it with anyone.
                </p>

                <p style="margin-top: 30px;">Thanks,<br><strong>BEAM Team</strong></p>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td style="background-color: #f4f4f7; text-align: center; padding: 20px; font-size: 12px; color: #888888;">
                &copy; 2026 BEAM. All rights reserved.<br>
                <a href="#" style="color: #6c5ce7; text-decoration: none;">Privacy Policy</a> |
                <a href="#" style="color: #6c5ce7; text-decoration: none;">Terms of Service</a>
            </td>
        </tr>

    </table>

</body>
</html>
